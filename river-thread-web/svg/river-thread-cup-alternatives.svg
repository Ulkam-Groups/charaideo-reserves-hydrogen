<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760"
     role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">Charaideo cup accent alternatives</title>
  <desc id="desc">Four different cup treatments replacing only the gold accent in the original Assamese river-thread mark.</desc>
  <defs>
    <g id="cha-river">
      <path
        d="M71.92 87.248 C90.44 80.432 100.648 70.424 100.648 52.768 C100.648 26.8 76.808 -0.2 49.809 -0.2 C31.721 -0.2 21.081 10.208 21.081 26.401 L21.081 122.992 L-4.256 122.992 L-4.256 136.624 L115.976 136.624 L115.976 122.992 L35.744 122.992 L35.744 117.24 C35.744 105.137 43.192 98.088 54.464 93.832 L71.92 87.248 Z M35.312 89.576 C35.744 87.68 36.376 76.176 36.376 56.193 L36.376 26.8 C36.376 19.152 40.432 14.032 50.008 14.032 C64.705 14.032 84.921 32.552 84.921 53.001 C84.921 61.28 81.296 68.096 66.6 73.416 L52.768 78.537 C43.425 81.928 38.504 86.816 36.176 89.576 L35.312 89.576 Z"
        transform="translate(109.14 247.2) scale(1 -1)" fill="#5C171C"/>
      <path d="M44.6 230.4 C111.8 185.6 176.2 286.4 282.6 213.6"
            fill="none" stroke="#78908C" stroke-width="7.56" stroke-linecap="round"/>
    </g>
    <style>
      .card{fill:#FFFCF5;stroke:#D8D2C8;stroke-width:1}
      .num{font:600 11px Manrope,Arial,sans-serif;letter-spacing:2.3px;fill:#B12B2D}
      .name{font:500 25px 'Cormorant Garamond','Times New Roman',serif;fill:#5C171C}
      .note{font:500 10px Manrope,Arial,sans-serif;letter-spacing:1.2px;fill:#68716F}
    </style>
  </defs>

  <rect width="1240" height="760" fill="#F6F0E4"/>
  <text x="50" y="45" class="num">TEA CUP / INTEGRATION STUDY</text>
  <text x="50" y="86" class="name" font-size="36">Four different structures—not four distorted circles.</text>
  <path d="M50 108 C295 82 502 130 790 101 C958 85 1087 91 1190 103" fill="none" stroke="#78908C" stroke-width="1.4" opacity=".65"/>

  <g transform="translate(50 135)">
    <rect class="card" width="550" height="270"/>
    <text x="22" y="30" class="num">01 / CUP ONLY</text>
    <svg x="145" y="42" width="260" height="186" viewBox="34 72 260 186">
      <use href="#cha-river"/>
      <path d="M273 101 H281 C288 101 291.5 104 291.5 108.5 C291.5 113 288 116 281 116 H273" fill="none" stroke="#5C171C" stroke-width="1.9" stroke-linecap="round"/>
      <circle cx="255" cy="108.5" r="19" fill="#B87936" stroke="#5C171C" stroke-width="1.9"/>
      <path d="M246.5 104.2 C251 100.6 259.4 99.9 265.7 102.2" fill="none" stroke="#FFF8EA" stroke-width=".75" stroke-linecap="round" opacity=".62"/>
    </svg>
    <text x="22" y="237" class="name">No saucer</text>
    <text x="305" y="237" class="note">PUREST TOP VIEW · LESS VISUAL NOISE</text>
  </g>

  <g transform="translate(640 135)">
    <rect class="card" width="550" height="270"/>
    <text x="22" y="30" class="num">02 / RIVER CRESCENT</text>
    <svg x="145" y="42" width="260" height="186" viewBox="34 72 260 186">
      <use href="#cha-river"/>
      <path d="M273 101 H281 C288 101 291.5 104 291.5 108.5 C291.5 113 288 116 281 116 H273" fill="none" stroke="#5C171C" stroke-width="1.9" stroke-linecap="round"/>
      <path d="M234 118 C245 130 270 131 281 118" fill="none" stroke="#78908C" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="255" cy="108.5" r="19" fill="#B87936" stroke="#5C171C" stroke-width="1.9"/>
      <path d="M246.5 104.2 C251 100.6 259.4 99.9 265.7 102.2" fill="none" stroke="#FFF8EA" stroke-width=".75" stroke-linecap="round" opacity=".62"/>
    </svg>
    <text x="22" y="237" class="name">One quiet crescent</text>
    <text x="305" y="237" class="note">CIRCULAR CUP · RIVER BELOW, NOT A RING</text>
  </g>

  <g transform="translate(50 440)">
    <rect class="card" width="550" height="270"/>
    <text x="22" y="30" class="num">03 / SIDE PROFILE</text>
    <svg x="145" y="42" width="260" height="186" viewBox="34 72 260 186">
      <use href="#cha-river"/>
      <path d="M274 104 H282 C289 104 292 107 292 111 C292 115 289 118 282 118 H275" fill="none" stroke="#5C171C" stroke-width="2" stroke-linecap="round"/>
      <path d="M236 102 H276 C275 115 268 122 256 122 C245 122 238 115 236 102 Z" fill="#F6F0E4" stroke="#5C171C" stroke-width="1.9" stroke-linejoin="round"/>
      <path d="M239 103 C248 106 266 106 273 103" fill="none" stroke="#B87936" stroke-width="3.8" stroke-linecap="round"/>
      <path d="M247 96 C243 91 249 88 247 83 M259 96 C255 91 261 88 259 83" fill="none" stroke="#78908C" stroke-width="1.4" stroke-linecap="round" opacity=".72"/>
    </svg>
    <text x="22" y="237" class="name">Shallow tea bowl</text>
    <text x="305" y="237" class="note">NOT ROUND · WARM HOSPITALITY</text>
  </g>

  <g transform="translate(640 440)">
    <rect class="card" width="550" height="270"/>
    <text x="22" y="30" class="num">04 / TEA-ROOM LINE</text>
    <svg x="145" y="42" width="260" height="186" viewBox="34 72 260 186">
      <use href="#cha-river"/>
      <path d="M237 102 C238 116 245 122 256 122 C267 122 274 116 275 102" fill="none" stroke="#5C171C" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M238 102 C248 105 265 105 274 102" fill="none" stroke="#B87936" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M274 105 H282 C288 105 290.5 107.5 290.5 111 C290.5 114.5 288 117 282 117 H276" fill="none" stroke="#5C171C" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M251 96 C246 90 253 87 250 81" fill="none" stroke="#78908C" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <text x="22" y="237" class="name">Drawn in four strokes</text>
    <text x="305" y="237" class="note">LIGHTEST · MOST LIKE THE EXISTING MARK</text>
  </g>
</svg>
