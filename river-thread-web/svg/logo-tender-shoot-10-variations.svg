<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="875" viewBox="0 0 1600 875"
     role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">Tender Shoot logo variations</title>
  <desc id="desc">Ten color and opacity studies for a separate tea stem behind the original Charaideo Assamese mark.</desc>

  <defs>
    <g id="original-mark">
      <path
        d="M71.92 87.248 C90.44 80.432 100.648 70.424 100.648 52.768 C100.648 26.8 76.808 -0.2 49.809 -0.2 C31.721 -0.2 21.081 10.208 21.081 26.401 L21.081 122.992 L-4.256 122.992 L-4.256 136.624 L115.976 136.624 L115.976 122.992 L35.744 122.992 L35.744 117.24 C35.744 105.137 43.192 98.088 54.464 93.832 L71.92 87.248 Z M35.312 89.576 C35.744 87.68 36.376 76.176 36.376 56.193 L36.376 26.8 C36.376 19.152 40.432 14.032 50.008 14.032 C64.705 14.032 84.921 32.552 84.921 53.001 C84.921 61.28 81.296 68.096 66.6 73.416 L52.768 78.537 C43.425 81.928 38.504 86.816 36.176 89.576 L35.312 89.576 Z"
        transform="translate(109.14 247.2) scale(1 -1)" fill="#5C171C"/>
      <path d="M44.6 230.4 C111.8 185.6 176.2 286.4 282.6 213.6"
            fill="none" stroke="#78908C" stroke-width="7.56" stroke-linecap="round"/>
      <path d="M240.6 107.2 C260.2 82 282.6 98.8 271.4 129.6 C251.8 132.4 240.6 124 240.6 107.2 Z"
            fill="#B87936"/>
    </g>
    <style>
      .card{fill:#FFFCF5;stroke:#D8D2C8;stroke-width:1}
      .num{font:600 11px Manrope,Arial,sans-serif;letter-spacing:2.4px;fill:#B12B2D}
      .name{font:500 24px 'Cormorant Garamond','Times New Roman',serif;fill:#5C171C}
      .spec{font:500 10px Manrope,Arial,sans-serif;letter-spacing:1.2px;fill:#68716F}
    </style>
  </defs>

  <rect width="1600" height="875" fill="#F6F0E4"/>
  <text x="40" y="48" class="num">TENDER SHOOT / TEN CONTROLLED STUDIES</text>
  <text x="40" y="88" class="name" font-size="35">The same mark. A confident stem with leaves held softly in the background.</text>
  <path d="M40 111 C350 82 606 138 963 102 C1173 82 1376 91 1560 108" fill="none" stroke="#78908C" stroke-width="1.4" opacity=".65"/>

  <!-- 01 · Aged indigo -->
  <g transform="translate(40 140)">
    <rect class="card" width="280" height="315"/>
    <text x="20" y="29" class="num">01</text>
    <svg x="30" y="42" width="220" height="158" viewBox="34 72 260 186">
      <path d="M234 219 C232 184 233 149 236 116" fill="none" stroke="#78908C" stroke-width="8" stroke-linecap="round" opacity=".1"/>
      <path d="M234 219 C232 184 233 149 236 116" fill="none" stroke="#78908C" stroke-width="3.4" stroke-linecap="round" opacity=".72"/>
      <path d="M236 143 C244 130 255 127 264 132 C258 144 248 150 236 143 Z" fill="#78908C" opacity=".23"/>
      <path d="M235 164 C227 153 217 151 210 157 C216 167 225 171 235 164 Z" fill="#78908C" opacity=".17"/>
      <use href="#original-mark"/>
    </svg>
    <text x="20" y="242" class="name">Aged indigo</text>
    <text x="20" y="269" class="spec">STEM 72% + SOFT DEPTH · LEAVES 23/17%</text>
    <text x="20" y="292" class="spec">CALM · CLOSEST TO THE RIVER</text>
  </g>

  <!-- 02 · Tea garden -->
  <g transform="translate(350 140)">
    <rect class="card" width="280" height="315"/>
    <text x="20" y="29" class="num">02</text>
    <svg x="30" y="42" width="220" height="158" viewBox="34 72 260 186">
      <path d="M234 219 C232 184 233 149 236 116" fill="none" stroke="#66755D" stroke-width="8" stroke-linecap="round" opacity=".11"/>
      <path d="M234 219 C232 184 233 149 236 116" fill="none" stroke="#66755D" stroke-width="3.5" stroke-linecap="round" opacity=".82"/>
      <path d="M236 143 C244 130 255 127 264 132 C258 144 248 150 236 143 Z" fill="#66755D" opacity=".27"/>
      <path d="M235 164 C227 153 217 151 210 157 C216 167 225 171 235 164 Z" fill="#66755D" opacity=".2"/>
