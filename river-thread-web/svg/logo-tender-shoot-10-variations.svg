    </svg>
    <text x="20" y="242" class="name">Indigo + gold</text>
    <text x="20" y="269" class="spec">STEM 78% + SOFT DEPTH · GOLD LEAF 27%</text>
    <text x="20" y="292" class="spec">LAYERED · CLOSEST TO BRAND PALETTE</text>
