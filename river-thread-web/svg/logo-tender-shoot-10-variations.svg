    <text x="20" y="242" class="name">Mist silhouette</text>
    <text x="20" y="269" class="spec">TAPERED STEM 58% + DEPTH · LEAF 16%</text>
    <text x="20" y="292" class="spec">SOFT · READS AS A DISTANT SHADOW</text>
