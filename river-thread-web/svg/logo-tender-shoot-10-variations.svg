  <g transform="translate(40 495)">
    <rect class="card" width="280" height="315"/>
    <text x="20" y="29" class="num">06</text>
    <svg x="30" y="42" width="220" height="158" viewBox="34 72 260 186">
      <path d="M234 219 C232 184 233 149 236 116" fill="none" stroke="#B12B2D" stroke-width="7" stroke-linecap="round" opacity=".08"/>
      <path d="M234 219 C232 184 233 149 236 116" fill="none" stroke="#B12B2D" stroke-width="3.1" stroke-linecap="round" opacity=".62"/>
      <path d="M236 143 C244 130 255 127 264 132 C258 144 248 150 236 143 Z" fill="#B12B2D" opacity=".18"/>
      <path d="M235 164 C227 153 217 151 210 157 C216 167 225 171 235 164 Z" fill="#B12B2D" opacity=".12"/>
