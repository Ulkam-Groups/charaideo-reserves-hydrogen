    <rect class="card" width="280" height="315"/>
    <text x="20" y="29" class="num">07</text>
    <svg x="30" y="42" width="220" height="158" viewBox="34 72 260 186">
      <path d="M234 219 C232 184 233 149 236 116" fill="none" stroke="#31484A" stroke-width="7.8" stroke-linecap="round" opacity=".1"/>
      <path d="M234 219 C232 184 233 149 236 116" fill="none" stroke="#31484A" stroke-width="3.3" stroke-linecap="round" opacity=".84"/>
      <path d="M236 143 C244 130 255 127 264 132 C258 144 248 150 236 143 Z" fill="#31484A" opacity=".2"/>
