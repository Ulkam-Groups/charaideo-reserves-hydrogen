      <path d="M234 219 C232 184 233 149 236 116" fill="none" stroke="#A55D43" stroke-width="3.5" stroke-linecap="round" opacity=".68"/>
      <path d="M236 143 C244 130 255 127 264 132 C258 144 248 150 236 143 Z" fill="#A55D43" opacity=".22"/>
