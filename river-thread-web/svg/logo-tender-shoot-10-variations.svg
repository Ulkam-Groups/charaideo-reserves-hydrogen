  <g transform="translate(970 140)">
    <rect class="card" width="280" height="315"/>
    <text x="20" y="29" class="num">04</text>
    <svg x="30" y="42" width="220" height="158" viewBox="34 72 260 186">
      <path d="M234 219 C232 184 233 149 236 116" fill="none" stroke="#B87936" stroke-width="8" stroke-linecap="round" opacity=".11"/>
      <path d="M234 219 C232 184 233 149 236 116" fill="none" stroke="#B87936" stroke-width="3.4" stroke-linecap="round" opacity=".8"/>
      <path d="M236 143 C244 130 255 127 264 132 C258 144 248 150 236 143 Z" fill="#B87936" opacity=".24"/>
      <path d="M235 164 C227 153 217 151 210 157 C216 167 225 171 235 164 Z" fill="#B87936" opacity=".16"/>
