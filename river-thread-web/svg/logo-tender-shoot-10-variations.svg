    <text x="20" y="29" class="num">10</text>
    <svg x="30" y="42" width="220" height="158" viewBox="34 72 260 186">
      <path d="M234 221 C232 185 233 147 236 110" fill="none" stroke="#5C171C" stroke-width="8.5" stroke-linecap="round" opacity=".07"/>
      <path d="M234 221 C232 185 233 147 236 110" fill="none" stroke="#5C171C" stroke-width="3.6" stroke-linecap="round" opacity=".72"/>
      <path d="M236 140 C243 131 252 129 259 134 C254 142 246 146 236 140 Z" fill="#5C171C" opacity=".13"/>
