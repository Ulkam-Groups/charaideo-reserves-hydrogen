  <g transform="translate(970 495)">
    <rect class="card" width="280" height="315"/>
    <text x="20" y="29" class="num">09</text>
    <svg x="30" y="42" width="220" height="158" viewBox="34 72 260 186">
      <path d="M229 221 C227 185 229 148 235 110 C243 149 244 187 241 221 C240 230 231 230 229 221 Z" fill="#78908C" opacity=".09"/>
      <path d="M232 220 C230 186 231 150 235 114 C241 150 242 186 239 220 C238 226 233 226 232 220 Z" fill="#78908C" opacity=".58"/>
      <path d="M236 143 C244 131 254 128 262 133 C257 143 247 149 236 143 Z" fill="#78908C" opacity=".16"/>
