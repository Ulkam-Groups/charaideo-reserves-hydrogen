<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1800"
     height="900"
     viewBox="0 0 900 450"
     role="img"
     aria-labelledby="title desc"
     shape-rendering="geometricPrecision">
  <title id="title">Charaideo tea-room cup landing animation</title>
  <desc id="desc">A small cup travels from the upper-right and settles quietly onto a waiting saucer beside the Assamese Cha.</desc>

  <style>
    .cup-flight {
      animation: cup-flight 5.6s linear infinite;
      will-change: transform, opacity;
    }
    .landing-cup {
      animation: cup-scale 5.6s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
      will-change: transform;
    }
    .landing-shadow {
      animation: shadow-land 5.6s ease-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .landing-ripple {
      animation: landing-ripple 5.6s ease-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes cup-flight {
      0% {opacity:0; transform:translate(-300px,-118px)}
      5%,16% {opacity:1; transform:translate(-300px,-118px)}
      20% {opacity:1; transform:translate(-291px,-119px)}
      24% {opacity:1; transform:translate(-275px,-117px)}
      28% {opacity:1; transform:translate(-253px,-112px)}
      32% {opacity:1; transform:translate(-226px,-104px)}
      36% {opacity:1; transform:translate(-195px,-94px)}
      40% {opacity:1; transform:translate(-161px,-81px)}
      44% {opacity:1; transform:translate(-126px,-66px)}
      48% {opacity:1; transform:translate(-91px,-50px)}
      52% {opacity:1; transform:translate(-58px,-32px)}
      55% {opacity:1; transform:translate(-24px,-13px)}
      58% {opacity:1; transform:translate(0,0)}
      58.8% {opacity:1; transform:translate(0,2px)}
      60.2%,91% {opacity:1; transform:translate(0,0)}
      97%,100% {opacity:0; transform:translate(0,0)}
    }
    @keyframes cup-scale {
      0%,16% {transform:scale(.34) rotate(-4deg)}
      24% {transform:scale(.41) rotate(-3.5deg)}
      32% {transform:scale(.55) rotate(-2.7deg)}
      40% {transform:scale(.7) rotate(-1.9deg)}
      48% {transform:scale(.85) rotate(-1deg)}
      55% {transform:scale(.96) rotate(-.25deg)}
      58%,100% {transform:scale(1) rotate(0)}
    }
    @keyframes shadow-land {
      0%,47% {opacity:0; transform:scale(.45)}
      58% {opacity:.14; transform:scale(1)}
      61% {opacity:.19; transform:scale(1.04)}
      69%,91% {opacity:.14; transform:scale(1)}
      97%,100% {opacity:0; transform:scale(1)}
    }
    @keyframes landing-ripple {
      0%,62% {opacity:0; transform:scale(.2)}
      66% {opacity:.48; transform:scale(.25)}
      78% {opacity:0; transform:scale(1)}
      100% {opacity:0; transform:scale(1)}
    }

    @media (prefers-reduced-motion: reduce) {
      .cup-flight, .landing-cup, .landing-shadow, .landing-ripple {animation:none}
      .cup-flight, .landing-cup {opacity:1; transform:none}
      .landing-shadow {opacity:.14; transform:none}
      .landing-ripple {opacity:0}
    }
  </style>

  <rect width="900" height="450" fill="#F6F0E4"/>

  <!-- The Assamese Cha remains completely still. -->
  <g transform="translate(-70 -90) scale(1.7)">
    <path
      d="M71.92 87.248 C90.44 80.432 100.648 70.424 100.648 52.768 C100.648 26.8 76.808 -0.2 49.809 -0.2 C31.721 -0.2 21.081 10.208 21.081 26.401 L21.081 122.992 L-4.256 122.992 L-4.256 136.624 L115.976 136.624 L115.976 122.992 L35.744 122.992 L35.744 117.24 C35.744 105.137 43.192 98.088 54.464 93.832 L71.92 87.248 Z M35.312 89.576 C35.744 87.68 36.376 76.176 36.376 56.193 L36.376 26.8 C36.376 19.152 40.432 14.032 50.008 14.032 C64.705 14.032 84.921 32.552 84.921 53.001 C84.921 61.28 81.296 68.096 66.6 73.416 L52.768 78.537 C43.425 81.928 38.504 86.816 36.176 89.576 L35.312 89.576 Z"
      transform="translate(109.14 247.2) scale(1 -1)"
      fill="#5C171C"/>
    <path
      d="M44.6 230.4 C111.8 185.6 176.2 286.4 282.6 213.6"
      fill="none"
      stroke="#78908C"
      stroke-width="7.56"
      stroke-linecap="round"/>
  </g>

  <!-- The saucer waits at the table throughout the animation. -->
  <circle cx="650" cy="225" r="122" fill="#FFFCF5" stroke="#B12B2D" stroke-width="1" stroke-opacity=".34"/>
  <ellipse class="landing-shadow" cx="650" cy="231" rx="91" ry="84" fill="#5C171C" opacity="0"/>

  <!-- The cup geometry is based on the approved no-saucer mark. -->
  <g transform="translate(650 225)">
    <g class="cup-flight">
      <g class="landing-cup">
      <path
        d="M88 -27 H121 C151 -27 166 -12 166 10 C166 32 151 47 121 47 H88"
        fill="none"
        stroke="#5C171C"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"/>
      <circle r="92" fill="#B87936" stroke="#5C171C" stroke-width="6"/>
      <circle class="landing-ripple" r="20" fill="none" stroke="#FFF8EA" stroke-width="2" opacity="0"/>
      <path
        d="M-45 -21 C-23 -41 23 -45 53 -31"
        fill="none"
        stroke="#FFF8EA"
        stroke-width="2.2"
        stroke-linecap="round"
        opacity=".68"/>
      </g>
    </g>
  </g>
</svg>
