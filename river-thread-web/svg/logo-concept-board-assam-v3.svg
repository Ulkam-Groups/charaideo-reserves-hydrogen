<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860"
     role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">Charaideo Assamese mark explorations</title>
  <desc id="desc">Four restrained variations of the original Assamese Cha mark using Gamosa, tea, liquor, and river heritage cues.</desc>

  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faded">
        <feFuncA type="table" tableValues="0 0.025"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="multiply"/>
    </filter>

    <g id="original-mark">
      <path
        d="M71.92 87.248 C90.44 80.432 100.648 70.424 100.648 52.768 C100.648 26.8 76.808 -0.2 49.809 -0.2 C31.721 -0.2 21.081 10.208 21.081 26.401 L21.081 122.992 L-4.256 122.992 L-4.256 136.624 L115.976 136.624 L115.976 122.992 L35.744 122.992 L35.744 117.24 C35.744 105.137 43.192 98.088 54.464 93.832 L71.92 87.248 Z M35.312 89.576 C35.744 87.68 36.376 76.176 36.376 56.193 L36.376 26.8 C36.376 19.152 40.432 14.032 50.008 14.032 C64.705 14.032 84.921 32.552 84.921 53.001 C84.921 61.28 81.296 68.096 66.6 73.416 L52.768 78.537 C43.425 81.928 38.504 86.816 36.176 89.576 L35.312 89.576 Z"
        transform="translate(109.14 247.2) scale(1 -1)" fill="#5C171C"/>
      <path d="M44.6 230.4 C111.8 185.6 176.2 286.4 282.6 213.6"
            fill="none" stroke="#78908C" stroke-width="7.56" stroke-linecap="round"/>
      <path d="M240.6 107.2 C260.2 82 282.6 98.8 271.4 129.6 C251.8 132.4 240.6 124 240.6 107.2 Z"
            fill="#B87936"/>
    </g>

    <style>
      .card {fill:#FFFCF5; stroke:#D8D2C8; stroke-width:1.2}
      .number {font:600 12px Manrope,Arial,sans-serif; letter-spacing:3px; fill:#B12B2D}
      .name {font:500 29px 'Cormorant Garamond','Times New Roman',serif; fill:#5C171C}
      .note {font:500 11px Manrope,Arial,sans-serif; letter-spacing:1.7px; fill:#5D6866}
    </style>
  </defs>

  <rect width="1400" height="860" fill="#F6F0E4" filter="url(#paper)"/>
  <text x="70" y="66" class="number">CHARAIDEO RESERVES / ASSAMESE MARK STUDY</text>
  <text x="70" y="111" class="name" font-size="40">Four quiet ways to let Assam live behind the letter.</text>
  <path d="M70 137 C370 105 606 162 954 126 C1108 110 1222 111 1330 125" fill="none" stroke="#78908C" stroke-width="1.5" opacity=".7"/>

  <!-- 01: Gamosa loom thread -->
  <g transform="translate(70 176)">
    <rect class="card" width="610" height="284" rx="2"/>
    <text x="32" y="38" class="number">01 / GAMOSA THREAD</text>
    <g transform="translate(172 45) scale(.77)">
      <path d="M232 218 L232 119" stroke="#B12B2D" stroke-width="7" opacity=".09"/>
      <g fill="#B12B2D" opacity=".28">
        <path d="M232 137 l4 5 -4 5 -4 -5 Z"/>
        <path d="M232 159 l4 5 -4 5 -4 -5 Z"/>
        <path d="M232 181 l4 5 -4 5 -4 -5 Z"/>
      </g>
      <use href="#original-mark"/>
    </g>
    <text x="32" y="257" class="note">A WOVEN RED WHISPER · MOST CULTURALLY DISTINCT</text>
  </g>

  <!-- 02: young tea shoot -->
  <g transform="translate(720 176)">
    <rect class="card" width="610" height="284" rx="2"/>
    <text x="32" y="38" class="number">02 / TENDER SHOOT</text>
    <g transform="translate(172 45) scale(.77)">
      <path d="M234 219 C232 184 233 149 236 116" fill="none" stroke="#78908C" stroke-width="3" stroke-linecap="round" opacity=".2"/>
      <path d="M236 143 C244 130 255 127 264 132 C258 144 248 150 236 143 Z" fill="#78908C" opacity=".18"/>
      <path d="M235 164 C227 152 217 150 210 156 C216 166 225 170 235 164 Z" fill="#78908C" opacity=".13"/>
      <use href="#original-mark"/>
    </g>
    <text x="32" y="257" class="note">A YOUNG TEA STEM · BOTANICAL, QUIET, IMMEDIATE</text>
  </g>

  <!-- 03: tea-liquor reflection -->
  <g transform="translate(70 500)">
    <rect class="card" width="610" height="284" rx="2"/>
    <text x="32" y="38" class="number">03 / LIQUOR REFLECTION</text>
    <g transform="translate(172 45) scale(.77)">
      <path d="M233 220 C230 187 231 151 235 116 C241 151 242 187 239 220 C238 225 234 225 233 220 Z" fill="#B87936" opacity=".13"/>
      <path d="M236 122 L236 214" stroke="#FFF9EE" stroke-width="1.4" stroke-linecap="round" opacity=".65"/>
      <use href="#original-mark"/>
    </g>
    <text x="32" y="257" class="note">AMBER LIGHT THROUGH TEA · THE MOST MINIMAL</text>
  </g>

  <!-- 04: river reed / Charaideo landscape -->
  <g transform="translate(720 500)">
    <rect class="card" width="610" height="284" rx="2"/>
    <text x="32" y="38" class="number">04 / RIVER REED</text>
    <g transform="translate(172 45) scale(.77)">
      <path d="M235 211 C235 178 235 145 237 115" fill="none" stroke="#78908C" stroke-width="3.2" stroke-linecap="round" opacity=".18"/>
      <path d="M229 220 C232 215 237 213 242 217" fill="none" stroke="#B87936" stroke-width="2.2" stroke-linecap="round" opacity=".23"/>
      <use href="#original-mark"/>
    </g>
    <text x="32" y="257" class="note">A REED ABOVE THE RIVER · PLACE BEFORE ORNAMENT</text>
  </g>
</svg>
